<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>SIYAI — Glass Top Bar (Mobile component)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SIYAI — Luxury glassmorphism TOP BAR · MOBILE component
   Self-contained: tokens + styles + markup. A floating frosted
   DARK-tinted pill (sits over a dark/image hero) with cream
   content. Drop the <header> in and include this CSS.
   ============================================================ */
:root{
  --gold:#D8A451; --cream:#FBF6EC;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --screen:460px;
}
*{ box-sizing:border-box; }
a{ text-decoration:none; color:inherit; }

/* ---- the floating frosted-glass pill ---- */
.glassbar-m{
  position:fixed; top:12px; left:12px; right:12px; z-index:60;
  max-width:calc(var(--screen) - 24px); margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 14px 13px 22px;
  border-radius:20px;
  background:linear-gradient(180deg, rgba(58,40,24,.55), rgba(28,18,10,.42));
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid rgba(244,234,217,.22);
  box-shadow:
    0 1px 0 rgba(255,247,232,.28) inset,   /* top sheen */
    0 -1px 0 rgba(0,0,0,.18) inset,
    0 16px 40px -16px rgba(0,0,0,.55),      /* float shadow */
    0 2px 8px -4px rgba(0,0,0,.35);
}
/* glass edge-light arc */
.glassbar-m::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,247,232,.30), transparent 46%);
}
.glassbar-m > *{ position:relative; z-index:1; }

/* ---- inner content ---- */
.glassbar-m .wm{ font-family:var(--serif); font-weight:600; font-size:21px; letter-spacing:.34em; padding-left:.34em; color:var(--cream); }
.glassbar-m .wm .ai{ color:var(--gold); }
.glassbar-m .burger{ width:46px; height:46px; display:grid; place-items:center; margin-right:-10px; background:none; border:none; cursor:pointer; }
.glassbar-m .burger .bars{ position:relative; width:26px; height:14px; }
.glassbar-m .burger .bars span{ position:absolute; left:0; right:0; height:2px; border-radius:2px; background:var(--cream); }
.glassbar-m .burger .bars span:nth-child(1){ top:0; }
.glassbar-m .burger .bars span:nth-child(2){ top:6px; }
.glassbar-m .burger .bars span:nth-child(3){ top:12px; }

@media (max-width:380px){
  .glassbar-m{ left:10px; right:10px; padding:12px 12px 12px 18px; border-radius:18px; }
}

/* ---- demo backdrop only (delete in production) ---- */
body{ margin:0; min-height:200vh; font-family:var(--sans);
  background:radial-gradient(120% 60% at 72% 6%, #5a3c22 0%, #2c1d11 42%, #160f08 100%); }
.demo-note{ position:fixed; left:50%; top:120px; transform:translateX(-50%); font-size:12px; color:rgba(244,234,217,.6); letter-spacing:.06em; text-align:center; width:80%; }
</style>
</head>
<body>

<!-- ============ COPY FROM HERE ============ -->
<header class="glassbar-m">
  <a href="#" class="wm">SIY<span class="ai">AI</span></a>
  <button class="burger" id="menuBtn" aria-label="Menu">
    <span class="bars"><span></span><span></span><span></span></span>
  </button>
</header>
<!-- ============ TO HERE ============ -->

<div class="demo-note">Floating dark-glass pill over a dark/image hero · this backdrop is demo-only</div>
</body>
</html>
