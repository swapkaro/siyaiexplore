<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SIYAI — Glass Top Bar (Desktop component)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   SIYAI — Luxury glassmorphism TOP BAR · DESKTOP component
   Self-contained: tokens + styles + markup. Drop the <header>
   into your page and include this CSS. Requires a non-empty
   body so the frosted glass has something to blur behind it.
   ============================================================ */
:root{
  --gold:#D8A451; --orange:#E27C42; --orange-2:#EC9663;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --maxw:1200px; --gut:clamp(28px,5vw,72px);
}
*{ box-sizing:border-box; }
a{ text-decoration:none; color:inherit; }

/* ---- the floating frosted-glass pill ---- */
.glassbar{
  position:fixed; inset:18px clamp(16px,4vw,40px) auto;   /* float, inset from edges */
  max-width:var(--maxw); margin:0 auto; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 16px 14px 26px;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.42));
  -webkit-backdrop-filter:blur(22px) saturate(1.6);
  backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid rgba(255,255,255,.7);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,        /* top sheen */
    0 -1px 0 rgba(214,164,81,.10) inset,       /* warm base line */
    0 18px 50px -18px rgba(60,40,22,.30),      /* ambient drop */
    0 2px 8px -4px rgba(60,40,22,.16);
  transition:padding .35s, box-shadow .35s, background .35s, top .35s, border-color .35s;
}
/* glass edge-light arc */
.glassbar::before{
  content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,.55), transparent 42%);
}
.glassbar > *{ position:relative; z-index:1; }

/* scrolled state — tightens + lifts (toggle .is-scrolled via JS) */
.glassbar.is-scrolled{
  top:10px; padding-block:11px;
  background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.62));
  border-color:rgba(255,255,255,.85);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 20px 46px -16px rgba(60,40,22,.34),
    0 3px 10px -5px rgba(60,40,22,.2);
}

/* ---- inner content ---- */
.glassbar .wm{ font-family:var(--serif); font-weight:600; font-size:22px; letter-spacing:.34em; padding-left:.34em; color:#1c160f; text-shadow:0 1px 0 rgba(255,255,255,.5); }
.glassbar .wm .ai{ color:var(--gold); }
.glassbar .links{ display:flex; gap:30px; list-style:none; margin:0; padding:0; }
.glassbar .links a{ font-family:var(--sans); font-size:15px; font-weight:500; color:#5a4b39; transition:color .2s; white-space:nowrap; }
.glassbar .links a:hover{ color:#1c160f; }
.glassbar .cta{
  font-family:var(--sans); font-weight:600; font-size:15px; color:#fff; white-space:nowrap;
  padding:12px 24px; border-radius:999px;
  background:linear-gradient(180deg, var(--orange-2), var(--orange));
  border:1px solid rgba(255,255,255,.28);
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 8px 20px -8px rgba(226,124,66,.6);
  transition:background .2s, transform .2s;
}
.glassbar .cta:hover{ background:linear-gradient(180deg, #f0a273, var(--orange-2)); transform:translateY(-1px); }

@media (max-width:900px){
  .glassbar{ inset:12px 12px auto; padding:12px 12px 12px 20px; border-radius:18px; }
  .glassbar .links{ display:none; }
}

/* ---- demo backdrop only (delete in production) ---- */
body{ margin:0; min-height:200vh; font-family:var(--sans);
  background:
    radial-gradient(60% 40% at 80% 6%, #f3d9b8, transparent 60%),
    radial-gradient(50% 40% at 10% 30%, #e7d6c0, transparent 60%),
    linear-gradient(180deg, #FCFBF8, #f0e7d8); }
.demo-note{ position:fixed; left:50%; top:120px; transform:translateX(-50%); font-family:var(--sans); font-size:13px; color:#8a7a64; letter-spacing:.04em; }
</style>
</head>
<body>

<!-- ============ COPY FROM HERE ============ -->
<header class="glassbar" id="glassbar">
  <a href="#" class="wm">SIY<span class="ai">AI</span></a>
  <nav>
    <ul class="links">
      <li><a href="#">Home</a></li>
      <li><a href="#">What you get</a></li>
      <li><a href="#">How it works</a></li>
      <li><a href="#">FAQs</a></li>
    </ul>
  </nav>
  <a href="#" class="cta">Create a voice letter</a>
</header>
<!-- ============ TO HERE ============ -->

<script>
  /* optional: tighten the bar after scrolling */
  (function(){
    const bar = document.getElementById('glassbar');
    const onScroll = () => bar.classList.toggle('is-scrolled', window.scrollY > 40);
    window.addEventListener('scroll', onScroll, { passive:true });
    onScroll();
  })();
</script>

<div class="demo-note">Scroll to see the bar tighten · this backdrop is demo-only</div>
</body>
</html>
